<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action / Галерея</title><link rel="stylesheet" href="style.css"><header><img class="brand-logo" src="assets/logo-left.svg" alt="Логотип слева"><label class="upload" tabindex="0" role="button" aria-label="Добавить изображение">Добавить изображение</label><img class="brand-logo brand-right" src="assets/logo-right.svg" alt="Логотип справа"></header><div id="session-bar" hidden><span id="phase-label"></span><span id="vote-budget"></span><button id="my-submissions">Мои работы</button></div><main><div id="stage"><div id="cards"></div><div id="empty" hidden>Пока нет одобренных работ</div></div></main><footer><div class="view-segments" role="group" aria-label="Вид галереи"><button id="sphere" class="active" aria-pressed="true">Сфера</button><button id="grid" aria-pressed="false">Сетка</button></div></footer><dialog id="detail"><button id="close" aria-label="Закрыть">✕</button><img id="large" alt=""><div id="work-actions"></div></dialog><dialog id="submission"><button class="dialog-close" aria-label="Закрыть">✕</button><h2>Добавить изображение</h2><p>Работа появится в галерее после одобрения.</p><form id="submit-form"><label>Ваше имя<input name="author" maxlength="60" required autocomplete="name"></label><label>Название работы<input name="title" maxlength="80" required></label><label class="file-field">Изображение<input id="files" type="file" accept="image/png,image/jpeg,image/webp" required></label><img id="upload-preview" alt="Предпросмотр" hidden><button type="submit">Отправить на модерацию</button><p id="submit-error" role="alert"></p></form></dialog><dialog id="my-dialog"><button class="dialog-close" aria-label="Закрыть">✕</button><h2>Мои работы</h2><div id="my-list"></div></dialog><div id="toast" role="status" hidden></div><script src="artwork.js"></script><script src="app.js"></script><script src="flow.js"></script></html>
