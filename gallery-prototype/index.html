<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Action / Галерея</title><link rel="stylesheet" href="style.css"><header><img class="brand-logo" src="assets/logo-left.svg" alt="Логотип слева"><label class="upload" tabindex="0" role="button" aria-label="Добавить изображение">Добавить изображение</label><button id="add-impression" class="upload" hidden>Что вас зацепило?</button><img class="brand-logo brand-right" src="assets/logo-right.svg" alt="Логотип справа"></header><div id="session-bar" hidden><span id="vote-budget"></span></div><main><div id="stage"><div id="cards"></div><div id="empty" hidden>Пока нет одобренных работ</div></div></main><footer><div class="view-segments" role="group" aria-label="Вид галереи"><button id="sphere" class="active" aria-pressed="true">Сфера</button><button id="grid" aria-pressed="false">Сетка</button></div></footer><dialog id="detail"><button id="close" aria-label="Закрыть">✕</button><img id="large" alt=""><div id="work-actions"></div></dialog><dialog id="submission"><button class="dialog-close" aria-label="Закрыть">✕</button><h2>Добавить изображение</h2><form id="submit-form"><label id="drop-zone" class="drop-zone"><input id="files" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Выбрать изображение"><strong>Перетащите изображение сюда</strong><span>или нажмите, чтобы выбрать файл</span><small>PNG, JPEG, WebP · до 20 МБ</small></label><img id="upload-preview" alt="Предпросмотр" hidden><button type="submit">Отправить</button><p id="submit-error" role="alert"></p></form></dialog><dialog id="my-dialog"><button class="dialog-close" aria-label="Закрыть">✕</button><h2>Мои работы</h2><div id="my-list"></div></dialog><dialog id="impression-dialog"><button class="dialog-close" aria-label="Закрыть">✕</button><h2>Что вас зацепило?</h2><form id="impression-form"><input id="impression-text" aria-label="Ваше впечатление" placeholder="От одного до трёх слов" maxlength="60" required><button type="submit">Отправить</button><p id="impression-error" role="alert"></p></form></dialog><div id="toast" role="status" hidden></div><script src="artwork.js"></script><script src="app.js"></script><script src="flow.js"></script></html>
