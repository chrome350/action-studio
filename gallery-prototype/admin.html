<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Галерея · Администратор</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><header><img class="brand-logo" src="assets/logo-left.svg" alt="Avito"><a href="./" target="_blank">Открыть галерею ↗</a><img class="brand-logo brand-right" src="assets/logo-right.svg" alt="Action"></header><section class="admin-wrap"><h1>Управление галереей</h1><form id="login"><label>Ключ администратора<input id="key" type="password" required autocomplete="current-password"></label><button>Войти</button><p>Ключ хранится локально в gallery-prototype/.local-data/admin-key</p></form><div id="dashboard" hidden><section class="admin-panel"><h2>Этап встречи</h2><p id="current-step"></p><button id="next-step"></button><h3 class="phase-heading">Выбрать этап вручную</h3><div id="phases"><button data-phase="upload">1. Приём работ</button><button data-phase="voting">2. Голосование</button><button data-phase="words">3. Впечатления</button><button data-phase="results">4. Обсуждение</button></div><div class="display-options"><label><input type="checkbox" id="liked"> Показывать только работы с лайками</label><label><input type="checkbox" id="show-words"> Показывать слова на сфере</label></div><p id="session-info"></p></section><section class="admin-panel"><div class="moderation-head"><h2>Работы</h2><select id="filter" aria-label="Статус работ"><option value="pending">На модерации</option><option value="approved">Опубликованные</option><option value="rejected">Не одобрены</option><option value="all">Все работы</option></select></div><div id="moderation"></div></section><section class="admin-panel" id="words-panel" hidden><div class="moderation-head"><h2>Слова участников <span id="word-count"></span></h2><select id="word-filter" aria-label="Статус слов"><option value="pending">На модерации</option><option value="approved">Одобренные</option><option value="rejected">Не одобрены</option><option value="all">Все слова</option></select></div><div id="word-moderation"></div></section><button id="logout">Выйти из админки</button></div><p id="admin-error" role="alert"></p></section><script src="admin.js"></script></html>
